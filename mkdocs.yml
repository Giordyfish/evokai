# The documentation site, built from docs/ (.github/workflows/docs.yml publishes it to GitHub Pages).
# Preview it locally with: uv run --group docs mkdocs serve
site_name: Evokai
site_description: Summon AI agents into any app, with the governance a company needs.
site_url: https://giordyfish.github.io/evokai/
repo_url: https://github.com/Giordyfish/evokai
repo_name: Giordyfish/evokai
edit_uri: edit/develop/docs/
copyright: Copyright 2026 Giordano Pescetelli. The name Evokai, its logo and its mascot are unregistered trademarks of Giordano Pescetelli.

docs_dir: docs
strict: true

# Links from docs/ to the rest of the repository become GitHub links on the site.
hooks:
  - scripts/mkdocs_hooks.py

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

theme:
  name: material
  logo: assets/evokai-logo.png
  favicon: assets/evokai-favicon.png
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - content.code.copy
    - content.action.edit
    - search.highlight
    - search.suggest

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Getting started:
      - Home: index.md
      - Quick start: quickstart.md
      - Features: features.md
      - Architecture: architecture.md
  - Guides:
      - Capabilities: capabilities.md
      - Knowledge bases: knowledge.md
      - Long-term memory: memory.md
      - Workflows: workflows.md
      - Code execution: code.md
      - Evals: evals.md
      - Cost governance: costs.md
      - Open standards:
          - AG-UI: ag-ui.md
          - OpenAI-compatible API: openai-compatible.md
          - A2A: a2a.md
  - Security & compliance:
      - Security of agents: security.md
      - Red team: redteam.md
      - Data protection: data-protection.md
      - Privacy: privacy.md
      - Compliance packs: compliance.md
      - Security assessment: security-assessment.md
  - Reference:
      - Configuration: configuration.md
      - Deployment: deployment.md
      - Releasing: releasing.md
      - The pydantic-ai Agent: pydantic-ai-agent.md
  - Channels: channels/README.md
  - Connectors:
      - connectors/README.md
      - SQL: connectors/sql.md
      - REST from OpenAPI: connectors/openapi.md
      - Google Drive: connectors/google-drive.md
      - SharePoint and OneDrive: connectors/microsoft-files.md
      - IMAP: connectors/imap.md
      - Per-user connections: connectors/connections.md
