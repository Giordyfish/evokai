[project]
name = "evokai-client"
version = "0.1.1"
description = "Python client for Evokai: session tokens, server runs, admin API and streamed session chats"
readme = "README.md"
authors = [
    { name = "Giordano Pescetelli", email = "giordano.pescetelli@gmail.com" }
]
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
keywords = ["evokai", "agents", "llm", "mcp", "sse", "client", "sdk"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Framework :: AsyncIO",
    "Framework :: Pydantic :: 2",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.11",
    "typing-extensions>=4.12",
]

[project.urls]
Homepage = "https://github.com/Giordyfish/evokai"
Repository = "https://github.com/Giordyfish/evokai"
Documentation = "https://github.com/Giordyfish/evokai/tree/main/clients/python#readme"
Issues = "https://github.com/Giordyfish/evokai/issues"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "evokai"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "respx>=0.22.0",
    "ruff>=0.17.5",
    "ty>=0.0.15",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = ["--strict-markers", "--strict-config"]

[tool.ruff]
line-length = 100
target-version = "py310"
preview = true
lint.select = [
  "E",    # pycodestyle errors
  "F",    # pyflakes
  "B",    # bugbear
  "I",    # imports
  "C4",   # comprehensions
  "UP",   # pyupgrade
  "S",    # security (bandit-like)
  "ARG",  # unused arguments
  "PIE",  # flake8-pie
  "PERF", # performance
  "LOG",  # logging best practices
  "RUF",  # ruff-specific rules
]
lint.extend-select = ["D", "DOC"]
lint.ignore = [
  "D100", # Missing docstring in public module
  "D104", # Missing docstring in public package
  "D105", # Missing docstring in magic method
  "D107", # Missing docstring in __init__ (documented on the class)
  "D203", # 1 blank line required before class docstring
  "D213", # Multi-line docstring summary should start at the first line
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
  "D",    # Ignore all docstring checks
  "DOC",  # Ignore all other docstring related checks
  "S101", # Ignore use of assert statements
  "S105", # Ignore use of hardcoded secrets
  "S106", # Ignore use of hardcoded passwords
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pydoclint]
# One-line docstrings of small, obvious methods need no Args/Returns sections.
ignore-one-line-docstrings = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.ty.environment]
python-version = "3.10"

[tool.ty.src]
include = ["src", "tests"]
