# Model profiles for the suitability estimate (evokai.llm.suitability). Every figure has its source and
# the date it refers to; a fact nobody sourced is absent, and an absent fact makes the estimate "to verify".
#
# - tau2_bench: pass^1 per domain (airline, retail, telecom) as published in the benchmark's own repository
#   (sierra-research/tau2-bench, web/leaderboard/public/submissions, read at a pinned commit on 2026-11-22).
#   Only submissions with all three domains are here; as_of is the submission's evaluation date. The
#   benchmark runs every task through tool calls, so a result there also sources tool calling.
# - streaming: Evokai streams every chat model of these providers (evokai.llm, the same rule the assistant's
#   activation uses, evokai.assistant.activation.supports_tools); other providers are unknown.
# - Context windows are not repeated here: they come from evokai/llm/context_windows.json (models.dev
#   snapshot with its own date) or EVOKAI_CONTEXT_WINDOWS.
# - No instruction-following or BFCL figure is here: none was read from its own page for these models.
version: 1
checked: '2026-11-22'
providers:
- providers: [bedrock, anthropic, openai, openai-chat, openai-responses, azure, google-gla, google-vertex, mistral]
  streaming: true
  source: https://github.com/Giordyfish/evokai/blob/develop/src/evokai/assistant/activation.py
  as_of: '2026-11-22'
models:
- name: "Claude Opus 4.5"
  patterns: ["*claude-opus-4-5*"]
  tool_calling: true
  tau2_bench:
    airline: 84.0
    retail: 79.61
    telecom: 92.32
    reasoning_effort: high
    benchmark_version: "1.0.1"
    submitted_by: Sierra
    source: https://github.com/sierra-research/tau2-bench/blob/768f3d8fe8528b4f32a5096f9ed008ae50f48ead/web/leaderboard/public/submissions/claude-opus-4-5_sierra_2026-02-26/submission.json
