- id: azure
  title: Azure OpenAI / Microsoft Foundry Models sold by Azure
  entity:
    name: Microsoft Corporation
    country: US
    controlled_from: US
    eu_contracting_entity: Microsoft Ireland Operations Limited (MIOL) is the billing entity for EMEA under the
      Microsoft Customer Agreement; in Limited Risk Distributor countries (e.g. FR, DE, AT, BE, DK, FI, IT, NL,
      SE, ES) the seller is the local subsidiary with MIOL as licensor
    sources:
    - https://learn.microsoft.com/en-us/azure/cost-management-billing/understand/mca-understand-your-invoice
  terms:
    training: false
    retention: abuse_monitoring
    zero_retention: on_request
    notes: 'Prompts, completions, embeddings are not available to OpenAI or other model providers, not used to train
      foundation models without permission; Microsoft hosts the models and they do not call OpenAI services. Abuse
      monitoring: flagged prompts/completions may be sampled; automated (LLM) review stores nothing; data for human
      review is kept in an abuse-monitoring store in the resource''s Azure geography (EEA deployments: reviewers
      located in the EEA). Retention period of that store is not stated on the current pages. Modified abuse monitoring
      (no storage, no human review) by Limited Access application; per the 17 Nov 2026 update it will not be available
      for models released on or after 1 Nov 2026 from a date to be announced. Stateful features (Responses API store,
      Assistants threads, stored completions, files, batch) store data at rest in the resource''s geography.'
    sources:
    - https://learn.microsoft.com/en-us/azure/ai-foundry/responsible-ai/openai/data-privacy
    - https://learn.microsoft.com/en-us/azure/ai-foundry/openai/concepts/abuse-monitoring
  caching:
    style: automatic
    reports_usage: true
    notes: 'Automatic for supported models (GPT-4o or newer, in-memory retention, typically cleared after 5-10 min
      idle, always within 1 h; extended 24h retention for gpt-4.1, gpt-5, gpt-5.1/5.2/5.4/5.5 families). Min 1,024
      identical prefix tokens; hits in 128-token increments (GPT-5.5 and earlier). Usage: prompt_tokens_details.cached_tokens
      (and cache_write_tokens on GPT-5.6+). GPT-5.6+ also accept explicit prompt_cache_breakpoint and prompt_cache_options
      (ttl 30m or 12h), cache writes may be charged. Cache reads discounted on Standard types; on provisioned (pre
      GPT-6) cached tokens don''t consume PTU. Extended caching keeps data within the data zone (Data Zone types)
      or region (Regional types); caches not shared between subscriptions.'
    sources:
    - https://learn.microsoft.com/en-us/azure/ai-foundry/openai/how-to/prompt-caching
  genai_prices: azure
  checked: '2026-11-19'
  unknowns:
  - 'terms.retention_days: the current data-privacy and abuse-monitoring pages do not state how long the human-review
    store keeps prompts/completions (older docs said 30 days; not confirmed today)'
