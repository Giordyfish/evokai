- id: google-vertex
  title: Google Vertex AI generative AI (docs now titled Gemini Enterprise Agent Platform)
  entity:
    name: Google LLC
    country: US
    controlled_from: US
    eu_contracting_entity: Google Cloud EMEA Limited, Dublin, Ireland, for EMEA except France (Google Cloud France),
      Italy (Google Cloud Italy S.r.l.) and Poland (local entity); read from the search excerpt of the official
      contracting-entity page, page body did not render
    sources:
    - https://cloud.google.com/terms/google-entity
  terms:
    training: false
    retention: abuse_monitoring
    retention_days: 90
    zero_retention: on_request
    notes: 'Google won''t use customer data to train or fine-tune models without prior permission. Abuse monitoring:
      for standard Google models prompts are logged only when classifiers flag activity, kept up to 90 days; frontier
      models up to 30 days (stored inside the customer''s environment); ''Advanced AI'' models log all prompts and
      responses up to 30 days and opt-out may not be possible. Customers with a Cloud Master Agreement are exempt
      from standard prompt logging by default. Data caching (in-memory and durable, deleted within 24 h) is on by
      default and can be disabled per project (cacheConfig). ZDR needs: request-response logging off, caching off,
      store=false in the Interactions API, no Live API session resumption, no Search/Maps grounding (Search query
      logs kept 3 days, Maps 30 days, not disableable), Deep Research retains 7 days.'
    sources:
    - https://docs.cloud.google.com/vertex-ai/generative-ai/docs/data-governance
    - https://docs.cloud.google.com/vertex-ai/generative-ai/docs/learn/abuse-monitoring
  caching:
    style: implicit_and_explicit
    reports_usage: true
    notes: Implicit caching on by default for all projects (many Gemini 2.5, 3.x and 4 models), 90% discount on
      cached tokens. Explicit caches created via the API, default TTL 60 min (extendable), plus storage cost per
      hour; 90% discount on Gemini 2.5+ (75% on 2.0). Min tokens 4,096 for Gemini 3 and 4 (6,144 for some 3.x preview
