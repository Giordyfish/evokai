processors:
- id: bedrock-guardrails
  kind: classifier
  title: Amazon Bedrock Guardrails (ApplyGuardrail prompt attack filter / InvokeGuardrailChecks)
  provider: bedrock
  detects: injection
  api: 'ApplyGuardrail: POST /guardrail/{guardrailIdentifier}/version/{guardrailVersion}/apply on bedrock-runtime,
    body {source: INPUT|OUTPUT, content: [GuardrailContentBlock], outputScope?: INTERVENTIONS|FULL}; response {action:
    NONE|GUARDRAIL_INTERVENED, actionReason, outputs:[{text}], assessments:[{contentPolicy:{filters:[{type, confidence,
    filterStrength, detected, action}]}, topicPolicy, wordPolicy, sensitiveInformationPolicy, contextualGroundingPolicy,
    automatedReasoningPolicy, invocationMetrics}], guardrailCoverage, usage:{contentPolicyUnits, topicPolicyUnits,
    ...}}. Prompt attack is a content filter of type PROMPT_ATTACK configured on the guardrail (CreateGuardrail
    contentPolicyConfig.filtersConfig, inputStrength NONE|LOW|MEDIUM|HIGH, inputAction BLOCK|NONE, tier CLASSIC|STANDARD);
    categories jailbreak, prompt injection, prompt leakage (Standard tier only). InvokeGuardrailChecks (detect-only,
    no guardrail resource): POST /guardrail-checks/invoke body {checks:{promptAttack:{categories:[{category: JAILBREAK|PROMPT_INJECTION|PROMPT_LEAKAGE}]},
    contentFilter:{categories:[...]}, sensitiveInformation:{entities:[{type}]}}, messages:[{role, content:[...]}]};
    response {results:{promptAttack:{results:[{category, severityScore 0-1}]}, contentFilter:{results:[...]}, sensitiveInformation:{results:[...],
    truncated}}, usage:{promptAttack:{textUnits}, ...}}.'
  place:
    from_deployment_region: true
  terms:
    training: false
    sources:
    - https://aws.amazon.com/bedrock/faqs/
  prices:
  - currency: USD
    unit: per_1000_text_units
    input: 0.15
    notes: 'ApplyGuardrail/inline guardrails: content filters (which include prompt attack) $0.15 per 1,000 text
      units, same for standard and classic tier; denied topics $0.15; sensitive information filters $0.10 (regex
      free); word filters free; contextual grounding $0.10. InvokeGuardrailChecks: prompt attack $0.08, content
      filters $0.07, sensitive information $0.10 per 1,000 text units. No Region stated for these prices.'
    sources:
    - https://aws.amazon.com/bedrock/pricing/
    checked: '2026-11-19'
  notes: Evokai uses the PROMPT_ATTACK content filter only, through ApplyGuardrail, in EVOKAI_GUARDRAIL_REGION (default
    EVOKAI_AWS_REGION). Text unit = up to 1,000 characters; longer inputs count as multiple units. With InvokeModel/Converse,
    user input must be wrapped in guardrail input tags or prompt attacks are not filtered; tool results and tool
    definitions are not evaluated for prompt attacks.
  sources:
  - https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-prompt-attack.html
  - https://docs.aws.amazon.com/bedrock/latest/APIReference/API_runtime_ApplyGuardrail.html
  - https://docs.aws.amazon.com/bedrock/latest/APIReference/API_runtime_InvokeGuardrailChecks.html
  - https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-use-invoke-guardrail-checks.html
  checked: '2026-11-19'
  unknowns:
  - 'regions: the listed Regions are for InvokeGuardrailChecks only; the Region list for ApplyGuardrail was not
    found on the guardrails-supported page'
  - 'price: the content-filter price is assumed to cover PROMPT_ATTACK in ApplyGuardrail because prompt attack is
    part of content filters there; the pricing page does not name ApplyGuardrail'
