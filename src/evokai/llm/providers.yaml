      an optional capability that may cause Customer Data to be stored outside the EUDB. Base URL: https://{resource}.openai.azure.com.'
    sources:
    - https://learn.microsoft.com/en-us/azure/ai-foundry/foundry-models/concepts/deployment-types
    - https://learn.microsoft.com/en-us/azure/ai-foundry/responsible-ai/openai/data-privacy
    - https://learn.microsoft.com/en-us/privacy/eudb/change-log
    checked: '2026-11-19'
    price_factor: 1.1
  - id: azure-regional-standard
    kind: regional (Azure geography)
    how_to_select: deployment SKU Standard (or ProvisionedManaged for Regional Provisioned)
    place: {}
    data_at_rest: resource's Azure geography
    notes: 'Prompts and responses processed within the customer-specified Azure geography, possibly between regions
      of that geography for operational purposes. Geography-based types launch last and have the narrowest model
      availability. Base URL: https://{resource}.openai.azure.com.'
    sources:
    - https://learn.microsoft.com/en-us/azure/ai-foundry/foundry-models/concepts/deployment-types
    checked: '2026-11-19'
    price_factor: 1.21
  - id: azure-global-standard
    kind: global
    how_to_select: deployment SKU GlobalStandard (also GlobalProvisionedManaged, GlobalBatch)
    place:
      geography: global
    data_at_rest: resource's Azure geography
    notes: 'Prompts and responses may be processed in any geography where the model is deployed; data at rest (incl.
      the abuse-monitoring store) stays in the customer-designated geography. Listed in the EU Data Boundary docs
      as an optional capability that may process Customer Data outside the EUDB. Base URL: https://{resource}.openai.azure.com.'
    sources:
    - https://learn.microsoft.com/en-us/azure/ai-foundry/foundry-models/concepts/deployment-types
    - https://learn.microsoft.com/en-us/azure/ai-foundry/responsible-ai/openai/data-privacy
