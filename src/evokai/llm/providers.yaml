# Evokai's provider catalog: who processes data, where, under whose control (evokai.llm.providers).
# Every fact was read on the official page in its `sources` on its `checked` date; null means nobody could
# verify it, and an unknown fact never satisfies a data protection rule. `unknowns` says what is missing.
# A deployment adds or overrides entries with EVOKAI_PROVIDERS_FILE (the same shape).
version: 1
checked: '2026-11-19'
providers:
- id: bedrock
  title: Amazon Bedrock
  entity:
    name: Amazon Web Services, Inc.
    country: US
    controlled_from: US
    eu_contracting_entity: 'Amazon Web Services EMEA SARL, Luxembourg (AWS Customer Agreement contracting-party
      table: any country in Europe, the Middle East or Africa except South Africa)'
    sources:
    - https://aws.amazon.com/agreement/
  terms:
    training: false
    retention: none
    zero_retention: default
    notes: 'FAQ: inputs/outputs are not used to train AWS or third-party models and are not shared with model providers;
      model providers have no access to the Model Deployment Accounts. Retention is per model and per Region (data_retention_mode
      none/default/aws_review/provider_data_share, set per account-Region or per bedrock-mantle project). Exceptions
      on the abuse-detection page: Claude Fable 5/5.1/5.2 retain all traffic up to 30 days (human review by AWS
      possible; requires aws_review mode; ZDR only via Enterprise Frontier Safeguards); OpenAI models other than
      gpt-oss/Safeguard retain classifier-flagged traffic up to 30 days (ZDR on request). Retained data is stored
      in the destination Region of a cross-Region profile. Claude models released before Fable 5 have no retention
      change (e.g. Opus 4.8 allows mode none). CSAM detection may store flagged image content.'
    sources:
    - https://aws.amazon.com/bedrock/faqs/
    - https://docs.aws.amazon.com/bedrock/latest/userguide/data-protection.html
    - https://docs.aws.amazon.com/bedrock/latest/userguide/data-retention.html
    - https://docs.aws.amazon.com/bedrock/latest/userguide/abuse-detection.html
  caching:
    style: implicit_and_explicit
    reports_usage: true
    notes: 'Anthropic Claude: explicit only (cachePoint in Converse, cache_control in InvokeModel/Messages; also
      a top-level automatic cache_control on Haiku 4.5, Sonnet 4.6, Opus 4.7/4.8/5/5.5, Sonnet 5/5.5, Haiku 5.5);
      up to 4 checkpoints; TTL 5 min default and 1 h (''ttl'':''1h''); min tokens per checkpoint 512 (Claude 5.x),
      1,024 (Sonnet 4.6, Sonnet 5, Opus 4.8), 4,096 (Haiku 4.5, Opus 4.5/4.6/4.7). Claude Sonnet 4.5 is not in the
      explicit-caching table. Amazon Nova (Micro/Lite/Pro, Nova 2 Lite): implicit caching for all text prompts (not
      reported or billed as cache reads) plus explicit checkpoints, min 1K tokens, max 20K tokens cached, 5 min
      TTL. OpenAI GPT on Bedrock: implicit (GPT-5.5 and earlier, min 1,024, no write fee); GPT-5.6+ also explicit
      prompt_cache_breakpoint, 30 min TTL, writes 1.25x. Converse reports cacheReadInputTokens/cacheWriteInputTokens;
      Responses API reports cached_tokens/cache_write_tokens. On-demand only, not batch.'
    sources:
    - https://docs.aws.amazon.com/bedrock/latest/userguide/prompt-caching.html
    - https://docs.aws.amazon.com/bedrock/latest/userguide/model-card-amazon-nova-lite.html
  genai_prices: aws
  checked: '2026-11-19'
  unknowns:
  - 'prices: the Bedrock pricing page renders per-model token prices with JavaScript; no Claude, Nova or Titan Text
    Embeddings V2 numbers were readable, so none are filled'
  - 'endpoints: Claude Sonnet 4.5, Nova Micro, Nova Pro and Titan Text Embeddings V2 model cards not read (their
    profile ids and EU destinations unverified)'
  - 'caching: Claude Sonnet 4.5 is absent from the explicit caching table; whether it still supports caching is
    unverified'
  endpoints:
  - id: bedrock-eu-profile
    kind: cross-region inference profile (geo)
    how_to_select: model id prefix eu. on bedrock-runtime in an EU source Region
    models:
    - bedrock:eu.*
    offered:
    - eu.anthropic.claude-haiku-4-5-20251001-v1:0
    - eu.anthropic.claude-sonnet-4-6
    - eu.anthropic.claude-opus-5-5
    - eu.amazon.nova-lite-v1:0
    place:
      geography: eu
      countries:
      - DE
      - SE
      - IT
      - ES
      - IE
      - FR
      regions:
      - eu-central-1
      - eu-north-1
      - eu-south-1
      - eu-south-2
      - eu-west-1
      - eu-west-3
    data_at_rest: eu
    notes: 'Destination Regions for Claude Haiku 4.5, Sonnet 4.6 and Opus 5.5 from eu-central-1/eu-north-1/eu-south-1/eu-south-2/eu-west-1/eu-west-3:
      Frankfurt, Stockholm, Milan, Spain, Ireland, Paris. Calling from eu-central-2 (Zurich, CH) adds eu-central-2;
      calling from eu-west-2 (London, GB) adds eu-west-2. Nova Lite EU profile from eu-central-1/eu-north-1 routes
      only to eu-central-1, eu-north-1, eu-west-1, eu-west-3 (adds the source for eu-south-1/eu-south-2; from il-central-1
      it adds il-central-1, outside the EU). Destinations vary by source Region and model: AWS says verify with
      GetInferenceProfile from each source Region. Geo-tied profiles'' destination lists never change. Retained
      abuse data, when any, is stored in the destination Region.'
    sources:
    - https://docs.aws.amazon.com/bedrock/latest/userguide/model-card-anthropic-claude-haiku-4-5.html
    - https://docs.aws.amazon.com/bedrock/latest/userguide/model-card-anthropic-claude-sonnet-4-6.html
    - https://docs.aws.amazon.com/bedrock/latest/userguide/model-card-anthropic-claude-opus-5-5.html
    - https://docs.aws.amazon.com/bedrock/latest/userguide/model-card-amazon-nova-lite.html
    - https://docs.aws.amazon.com/bedrock/latest/userguide/inference-profiles-support.html
    checked: '2026-11-19'
  - id: bedrock-us-profile
    kind: cross-region inference profile (geo)
    how_to_select: model id prefix us.
    models:
    - bedrock:us.*
    offered:
    - us.anthropic.claude-haiku-4-5-20251001-v1:0
    - us.anthropic.claude-sonnet-4-6
    - us.anthropic.claude-opus-5-5
    - us.amazon.nova-lite-v1:0
    place:
      geography: us
      countries:
      - US
      regions:
      - us-east-1
      - us-east-2
      - us-west-1
      - us-west-2
    notes: 'Claude: from us-east-1/us-east-2/us-west-2 routes to us-east-1, us-east-2, us-west-2; from us-west-1
      adds us-west-1; from ca-central-1 / ca-west-1 adds that Canadian Region.'
    sources:
    - https://docs.aws.amazon.com/bedrock/latest/userguide/model-card-anthropic-claude-sonnet-4-6.html
    checked: '2026-11-19'
  - id: bedrock-apac-profile
    kind: cross-region inference profile (geo)
    how_to_select: model id prefix apac. (Nova); Claude Haiku 4.5 / Sonnet 4.6 / Opus 5.5 use au., jp. (and in.
      for Haiku 4.5) instead
    models:
    - bedrock:apac.*
    offered:
    - apac.amazon.nova-lite-v1:0
    place:
      geography: apac
      regions:
      - ap-northeast-1
      - ap-northeast-2
      - ap-northeast-3
      - ap-south-1
      - ap-southeast-1
      - ap-southeast-2
    notes: Regions listed are Nova Lite's destinations from Tokyo/Seoul/Mumbai/Singapore/Sydney; other sources add
      more APAC Regions. Claude au. = Sydney, Melbourne; jp. = Tokyo, Osaka; in. = Mumbai, Hyderabad.
    sources:
    - https://docs.aws.amazon.com/bedrock/latest/userguide/model-card-amazon-nova-lite.html
    - https://docs.aws.amazon.com/bedrock/latest/userguide/model-card-anthropic-claude-haiku-4-5.html
    checked: '2026-11-19'
  - id: bedrock-global-profile
    kind: global cross-region inference profile
    how_to_select: model id prefix global.
    models:
    - bedrock:global.*
    offered:
    - global.anthropic.claude-haiku-4-5-20251001-v1:0
    - global.anthropic.claude-sonnet-4-6
    - global.anthropic.claude-opus-5-5
    place:
      geography: global
    notes: Destinations include all commercial AWS Regions (Americas, EMEA incl. il-central-1, me-central-1, me-south-1,
      af-south-1, and Asia Pacific) and can grow over time; may include opt-in Regions not enabled in the account.
      Not offered for Nova Lite.
    sources:
    - https://docs.aws.amazon.com/bedrock/latest/userguide/inference-profiles-support.html
    - https://docs.aws.amazon.com/bedrock/latest/userguide/model-card-anthropic-claude-haiku-4-5.html
    checked: '2026-11-19'
  - id: bedrock-in-region
    kind: in-region
    how_to_select: bare model id on bedrock-runtime.{region}.amazonaws.com, or bare id on bedrock-mantle.{region}.api.aws
      where the model card lists in-Region mantle support
    models:
    - bedrock:*
    exclude:
    - bedrock:eu.*
    - bedrock:us.*
    - bedrock:apac.*
    - bedrock:global.*
    - bedrock:au.*
    - bedrock:jp.*
    - bedrock:ca.*
    - bedrock:us-gov.*
    offered:
    - 'amazon.nova-lite-v1:0 (runtime in-Region: eu-north-1, eu-west-2)'
    - 'anthropic.claude-sonnet-4-6 (runtime in-Region: eu-west-2 only)'
    - 'anthropic.claude-opus-5-5 (runtime in-Region: eu-west-2 only)'
    - 'anthropic.claude-haiku-4-5 (mantle in-Region: eu-north-1, eu-west-1; no runtime in-Region)'
    place:
      from_deployment_region: true
    notes: 'In-Region keeps processing in one Region. For Claude Haiku 4.5 the runtime endpoint requires a geo/global
      profile; single-Region inference is via bedrock-mantle (https://bedrock-mantle.{region}.api.aws/anthropic/v1/messages).
      Opus 5.5 mantle in-Region only us-east-1, ap-southeast-4, us-gov-west-1. Availability is per model: check
      each model card. Base URL: https://bedrock-runtime.{region}.amazonaws.com.'
    sources:
    - https://docs.aws.amazon.com/bedrock/latest/userguide/model-card-anthropic-claude-haiku-4-5.html
    - https://docs.aws.amazon.com/bedrock/latest/userguide/model-card-anthropic-claude-sonnet-4-6.html
    - https://docs.aws.amazon.com/bedrock/latest/userguide/model-card-anthropic-claude-opus-5-5.html
    - https://docs.aws.amazon.com/bedrock/latest/userguide/model-card-amazon-nova-lite.html
    checked: '2026-11-19'
  prices:
  - models:
    - bedrock:eu.anthropic.claude-haiku-4-5-20251001-v1:0
    currency: USD
    input: 1.1
    output: 5.5
