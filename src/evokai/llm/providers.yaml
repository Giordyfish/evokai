  - id: azure-datazone-eu
    kind: data zone
    how_to_select: deployment SKU DataZoneStandard (or DataZoneProvisionedManaged, DataZoneBatch) in a Foundry resource
      located in an EU member state
    place:
      geography: eu
    data_at_rest: resource's Azure geography
    notes: 'Data-privacy page: processing in that or any other EU member nation. Deployment-types page: the EU Data
      Zone follows the Azure EU Data Boundary, which can include EFTA countries such as Norway and Switzerland;
