# The built-in console assistant, shipped with Evokai (evokai.assistant.bootstrap).
#
# Applied at start while the application is locked; an owner who unlocks it keeps their changes,
# and a reset applies this file again. At start, the agent's model is the one an owner activated
# (none until then), its instructions are prompt.md, the MCP server's url is EVOKAI_INTERNAL_URL
# and the docs skill is skills/evokai-docs.
application:
  slug: evokai-assistant
  name: Evokai assistant
  storage_mode: evokai
  conversation_ttl_days: 30
  monthly_cap_usd: 20
  # Its evals' monthly budget: one try of the suite on a large model uses about a third of the
  # default (2), so the owner could not compare three models. This fits about fifteen tries.
  defaults:
    eval_monthly_usd: 10
  memory:
    mode: "off"
  redteam:
    gate: "off"
    on_save: false
  security:
    modes:
      input.injection: enforce
      untrusted.spotlight: enforce
  ask_rules: []
  # Its conversations read other applications' data: traces keep timings and counts only.
  tracing:
    content: none
mcp_servers:
  - name: evokai-admin
    url: "http://127.0.0.1:8787/agent/mcp/admin"
    auth: forward_user
    timeout_seconds: 120
grants:
  knowledge:
    "*": false
  channels:
    server: false
agents:
  - name: assistant
    title: Evokai assistant
    model: "evokai:unset"
    mcp_servers: [evokai-admin]
    skills: [evokai-docs]
    channels: [browser]
    max_tool_calls_per_turn: 8
    client_tools:
      navigate:
        enabled: true
        description: >-
          Take the person to a page of the Evokai console. Paths: /apps (every application), /apps/{slug}
          (an application's overview), /apps/{slug}/{tab} with tab one of agents, evals, perms, mcp, connections,
          channels, skills, prompts, knowledge, workflows, approvals, keys, limits, usage, traces,
          conversations, security, privacy, providers, compliance, audit; /apps/{slug}/agents/{agent} (one
          agent); /usage, /health, /access, /assistant, /preferences, /playground, /setup. {slug} is the
          application's slug as the admin tools return it (e.g. vita), never its name or its id.
        path_pattern: "^/(apps|setup|playground|usage|health|access|preferences|assistant)(/[A-Za-z0-9_.:-]+)*/?(\\?[A-Za-z0-9=&_.:-]*)?$"
      chart: true
      diagram: false
      ask: true
      memory: false
      custom:
        - name: playground
          wait: true
          description: >-
            Talk to an agent in the console's playground, in front of the person: it opens the playground on the
            application and agent, types the message there and sends it, and returns the agent's answer (its text,
            the tools it used, and whether it now waits for a confirmation or a choice, which the person gives in
            the playground). One message per call; the conversation continues on the next call.
          parameters:
            type: object
            properties:
              application:
                type: string
                maxLength: 120
                description: The application's slug (list_applications).
              agent:
                type: string
                maxLength: 120
                description: The agent's name.
              message:
                type: string
                minLength: 1
                maxLength: 4000
                description: What to say to the agent.
              new:
                type: boolean
                description: Start a new conversation instead of continuing the one open in the playground.
            required: [application, agent, message]
            additionalProperties: false
    suggestions:
      - "What do my applications have?"
      - "Which agents use the most of the cap?"
      - "How do I connect an MCP server?"
    suggestions_by_locale:
      it:
        - "Cosa contengono le mie applicazioni?"
        - "Quali agenti usano di più il tetto di spesa?"
        - "Come collego un server MCP?"
