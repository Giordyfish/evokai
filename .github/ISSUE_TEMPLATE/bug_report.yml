name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        For a security vulnerability, do not open an issue: see SECURITY.md.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: The smallest steps, configuration (without secrets) and requests that show it.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The release, image tag or commit.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: How Evokai runs (image, uv), the database, the model provider, the client and its version.
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant log lines, with secrets and personal data removed.
      render: text
