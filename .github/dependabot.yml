# Weekly updates. Minor and patch updates are grouped, one pull request per ecosystem a week; a major update comes
# alone, since it may need code changes. Actions stay pinned to commit SHAs (Dependabot updates the SHA and the
# version comment together).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule: {interval: weekly}
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: uv
    directories: ["/", "/clients/python", "/workers/capability"]
    target-branch: develop
    schedule: {interval: weekly}
    groups:
      python:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    directories: ["/clients/typescript", "/clients/ui", "/admin"]
    target-branch: develop
    schedule: {interval: weekly}
    ignore:
      # TypeScript 7 ships without the compiler API that typescript-eslint, tsup's declaration build and
      # openapi-typescript load; retry when they support it.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
    groups:
      npm:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /
    target-branch: develop
    schedule: {interval: weekly}
