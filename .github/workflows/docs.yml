# The documentation site (mkdocs.yml, built from docs/): a strict build on every pull request that touches it, and
# a build published to GitHub Pages on every push to main (or by hand from main).
name: Docs

on:
  pull_request:
    paths: &docs-paths
      - docs/**
      - mkdocs.yml
      - scripts/mkdocs_hooks.py
      - pyproject.toml
      - uv.lock
      - .github/workflows/docs.yml
  push:
    branches: [main]
    paths: *docs-paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_COLOR: "1"
  NO_MKDOCS_2_WARNING: "1"

jobs:
  build:
    name: Build (strict)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.8"
          enable-cache: false   # nothing cached may reach a published site
      # Only the docs group (MkDocs and Material): not the service or its dependencies. Any warning fails the build.
      - run: uv run --locked --only-group docs mkdocs build --strict
      - if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write      # publish the site
      id-token: write   # prove the deployment comes from this workflow
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # One deployment at a time, and a running one is never cancelled halfway.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
