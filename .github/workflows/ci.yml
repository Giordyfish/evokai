# The same gates as scripts/ci.sh, one job per part. The release workflow calls this one first.
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_COLOR: "1"

jobs:
  # main takes pull requests from develop (or an urgent hotfix/... branch) only.
  pr-source:
    name: Pull request source
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
        run: |
          case "$HEAD_REF" in develop|hotfix/*) ;; *) echo "::error::main takes pull requests from develop or hotfix/... only, not $HEAD_REF"; exit 1 ;; esac
          [ "$HEAD_REPO" = "$BASE_REPO" ] || { echo "::error::main takes pull requests from this repository's branches only"; exit 1; }

  service:
    name: service (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: evokai
          POSTGRES_PASSWORD: evokai-ci
          POSTGRES_DB: evokai_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U evokai -d evokai_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      UV_PYTHON: ${{ matrix.python }}
      # scripts/ci.sh runs the suite on SQLite, then again on this Postgres.
      EVOKAI_TEST_DATABASE_URL: postgresql://evokai:evokai-ci@localhost:5432/evokai_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.8"
          enable-cache: true
      # The em dash check, the secret scan of the tree (gitleaks), ruff, ty, pytest and the OpenAPI check.
      - run: scripts/ci.sh service

  python-client:
    name: Python client (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.15"]   # the oldest and the newest supported
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.8"
          enable-cache: true
      - run: scripts/ci.sh python

  client:
    name: TypeScript client (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "26"]   # the oldest and the newest supported
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: clients/typescript/package-lock.json
      - run: scripts/ci.sh client

  ui:
    name: UI components (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "26"]   # the oldest and the newest supported
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            clients/typescript/package-lock.json
            clients/ui/package-lock.json
      - run: scripts/ci.sh ui

  console:
    name: Admin console
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - run: scripts/ci.sh console

  worker:
    name: Capability worker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.8"
          enable-cache: true
      - run: scripts/ci.sh worker

  quickstart:
    name: Quick start (Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Builds the image from docker-compose.yml, then health, console, an application, an agent and one chat turn.
      - run: scripts/quickstart-smoke.sh

  workflows:
    name: Workflow security (zizmor)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.8"
      - run: uvx zizmor@1 --offline --min-severity medium .github/workflows
