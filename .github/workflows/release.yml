# A release, from a tag vX.Y.Z (see docs/releasing.md for the one-time setup):
#   - every gate (the CI workflow);
#   - the service image, lite and full, linux/amd64 and linux/arm64, to ghcr.io/giordyfish/evokai, signed (keyless);
#   - the Python client (evokai-client) and its alias (evokai) to PyPI with trusted publishing: no token in the
#     repository;
#   - the npm packages @evokai/evokai-client, @evokai/evokai-ui and the alias evokai, with trusted publishing and
#     provenance.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/giordyfish/evokai

jobs:
  versions:
    name: Tag matches the package versions
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: v
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          fail=0
          for f in pyproject.toml clients/python/pyproject.toml workers/capability/pyproject.toml clients/aliases/python/pyproject.toml; do
            got=$(sed -n 's/^version = "\(.*\)"$/\1/p' "$f" | head -1)
            [ "$got" = "$version" ] || { echo "::error file=$f::version $got, tag $version"; fail=1; }
          done
          for f in clients/typescript/package.json clients/ui/package.json admin/package.json clients/aliases/npm/package.json; do
            got=$(node -p "require('./$f').version")
            [ "$got" = "$version" ] || { echo "::error file=$f::version $got, tag $version"; fail=1; }
          done
          peer=$(node -p "require('./clients/ui/package.json').peerDependencies['@evokai/evokai-client']")
          [ "$peer" = "$version" ] || { echo "::error::@evokai/evokai-ui peer dependency $peer, tag $version"; fail=1; }
          dep=$(node -p "require('./clients/aliases/npm/package.json').dependencies['@evokai/evokai-client']")
          [ "$dep" = "$version" ] || { echo "::error::evokai (npm) dependency $dep, tag $version"; fail=1; }
          grep -q "\"evokai-client==$version\"" clients/aliases/python/pyproject.toml \
            || { echo "::error file=clients/aliases/python/pyproject.toml::dependency is not evokai-client==$version"; fail=1; }
          exit $fail

  gates:
    name: Gates
    needs: versions
    uses: ./.github/workflows/ci.yml

  image:
    name: Image (${{ matrix.flavour }})
    needs: [versions, gates]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write   # push to ghcr.io
      id-token: write   # keyless signing (Sigstore)
    strategy:
      fail-fast: false
      matrix:
        flavour: [lite, full]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          cache-binary: false   # a release builds from nothing cached
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: tags
        env:
          v: ${{ needs.versions.outputs.version }}
          FLAVOUR: ${{ matrix.flavour }}
        run: |
          if [ "$FLAVOUR" = lite ]; then
            tags="$IMAGE:$v"
            case "$v" in *-*) ;; *) tags="$tags,$IMAGE:latest" ;; esac
          else
            tags="$IMAGE:$v-full"
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runtime
          platforms: linux/amd64,linux/arm64
          build-args: IMAGE=${{ matrix.flavour }}
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/Giordyfish/evokai
            org.opencontainers.image.version=${{ needs.versions.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=Apache-2.0
          push: true
          provenance: mode=max
          sbom: true
      - name: Smoke test (read-only, no network, uid 1001)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          FLAVOUR: ${{ matrix.flavour }}
        run: |
          ref="$IMAGE@$DIGEST"
          for platform in linux/amd64 linux/arm64; do
            docker run --rm --platform "$platform" --read-only --tmpfs /tmp --network none --cap-drop ALL \
              --user 1001:1001 "$ref" selftest | tee /dev/stderr | grep -q "flavour=$FLAVOUR "
          done
      - name: Sign the digest (keyless)
        env:
          REVISION: ${{ github.sha }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: scripts/sign-image.sh "$IMAGE@$DIGEST"

  pypi:
    name: PyPI (evokai-client)
    needs: [versions, gates]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/project/evokai-client/
    permissions:
      contents: read
      id-token: write   # trusted publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.8"
          enable-cache: false   # nothing cached may reach a published artifact
      - run: cd clients/python && uv build --out-dir ../../dist/python
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          packages-dir: dist/python

  # Its own environment: PyPI refuses two pending publishers with the same repository, workflow and environment.
  pypi-alias:
    name: PyPI (evokai)
    needs: [versions, pypi]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi-alias
      url: https://pypi.org/project/evokai/
    permissions:
      contents: read
      id-token: write   # trusted publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.8"
          enable-cache: false   # nothing cached may reach a published artifact
      - run: cd clients/aliases/python && uv build --out-dir ../../../dist/python
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          packages-dir: dist/python

  npm:
    name: npm (@evokai/evokai-client, @evokai/evokai-ui, evokai)
    needs: [versions, gates]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: npm
      url: https://www.npmjs.com/package/@evokai/evokai-client
    permissions:
      contents: read
      id-token: write   # npm provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false   # nothing cached may reach a published artifact
      - name: Build the client
        run: cd clients/typescript && npm ci --no-audit --no-fund && npm run build
      - name: Build the UI components
        run: cd clients/ui && npm ci --no-audit --no-fund && npm run build
      # Trusted publishing (OpenID Connect): npm 11.5.1 or newer exchanges the job's identity for a short-lived token,
      # so no npm token is stored anywhere. Each package names this repository, release.yml and the npm environment
      # as its trusted publisher, allowed to publish (not to manage dist-tags).
      - run: npm install --global npm@11
      - name: Publish
        env:
          VERSION: ${{ needs.versions.outputs.version }}
        run: |
          tag=latest
          case "$VERSION" in *-*) tag=next ;; esac
          (cd clients/typescript && npm publish --provenance --access public --tag "$tag")
          (cd clients/ui && npm publish --provenance --access public --tag "$tag")
          (cd clients/aliases/npm && npm publish --provenance --access public --tag "$tag")
