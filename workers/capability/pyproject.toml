[project]
name = "evokai-capability-worker"
version = "0.2.2"
description = "Serves one pydantic-ai-harness capability's tools over MCP for Evokai, outside its image."
requires-python = ">=3.14,<3.15"
license = "Apache-2.0"
dependencies = [
    "pydantic-ai-harness==0.69.0",
    "pydantic-ai-slim==2.69.0",
    "uvicorn>=0.38",
    "starlette>=0.50",
]

[project.optional-dependencies]
# One capability per worker image: browser-use and kubernetes cannot be installed together
# (browser-use pins pydantic and protobuf below what the kubernetes agent-sandbox client needs).
browser = ["pydantic-ai-harness[browser-use,playwright]==0.69.0"]
kubernetes = ["pydantic-ai-harness[kubernetes]==0.69.0"]

[project.scripts]
evokai-worker = "evokai_worker.server:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evokai_worker"]

[tool.uv]
conflicts = [[{ extra = "browser" }, { extra = "kubernetes" }]]
# browser-use 0.13.14 (the newest pydantic-ai-harness 0.x accepts) and browser-harness pin these
# exactly, at versions with published security advisories. Raised to the first fixed releases,
# same majors except Pillow 13 (whose removals browser-use, browser-harness and reportlab do not use).
override-dependencies = [
    "anyio>=4.14.2",
    "mcp>=2.2.0,<3",
    "pillow>=13.0.0,<14",
    "pypdf>=6.21.4,<7",
]

[dependency-groups]
dev = ["pytest>=8.4", "pytest-asyncio>=1.2", "httpx>=0.28", "ruff>=0.14"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
